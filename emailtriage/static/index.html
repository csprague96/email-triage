<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Email Triage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M8 11h16v11H8z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M8 12l8 6 8-6' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint so there is no flash.
  (function () {
    try {
      var pref = localStorage.getItem('et-theme') || 'system';
      var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePref = pref;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
<aside id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Email details"></aside>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="help" class="help hidden" role="dialog" aria-label="Keyboard shortcuts"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
